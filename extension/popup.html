<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 220px;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1e; color: #e0e0e0; }
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .header img {
    width: 32px;
    height: 32px;
    border-radius: 6px;
  }
  .header span {
    font-size: 13px;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .row label {
    font-size: 13px;
  }
  /* Toggle switch */
  .toggle {
    position: relative;
    width: 42px;
    height: 24px;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle input:checked + .slider {
    background: #e8a318;
  }
  .toggle input:checked + .slider::before {
    transform: translateX(18px);
  }
</style>
</head>
<body>
  <div class="header">
    <img src="icon-48.png" alt="">
    <span>YouTube Original Titles</span>
  </div>
  <div class="row">
    <label for="toggle">Enabled</label>
    <div class="toggle">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
